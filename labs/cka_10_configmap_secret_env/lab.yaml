apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-10-configmap-secret-env-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-10-configmap-secret-env\ntitle: 'CKA 10: ConfigMap, Secret e variaveis'\ndescription: Injete configuracao\
    \ e segredo em um Pod e valide por exec.\nduration: 25m\ntimerEnabled: true\nmaxDuration: 25m\nimage: linuxtips/girus-kind-single-node:0.1\n\
    type: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- workloads\ntasks:\n- name: Injetar configuracoes e segredos\
    \ em Pods\n  description: Fixar separacao entre configuracao, segredo e imagem do container.\n  steps:\n  - '**Objetivo\
    \ de fixacao:** este lab pratica ConfigMap, Secret e variaveis de ambiente para fixar separacao entre configuracao,\n\
    \    segredo e imagem do container.'\n  - '**Como pensar antes de executar:** leia o enunciado, identifique o recurso\
    \ Kubernetes envolvido, execute o menor comando\n    que cria ou altera o recurso e valide o estado final com `get`, `describe`,\
    \ `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos e parametros importantes:**\n\n    - kubectl create configmap cria dados\
    \ nao sensiveis.\n\n    - kubectl create secret generic cria dados sensiveis codificados pelo Kubernetes.\n\n    - --env\
    \ define variaveis diretamente no Pod.\n\n    - printenv prova que a variavel chegou ao processo.'\n  - '**Referencias\
    \ oficiais para estudo:**\n\n    - https://kubernetes.io/docs/concepts/workloads/pods/\n\n    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/'\n\
    \  - '**Pratica:** execute os comandos abaixo e observe a saida de cada etapa. No CKA, criar o recurso e so metade do\
    \ trabalho;\n    a outra metade e provar tecnicamente que ele ficou no estado esperado.'\n  - kubectl create namespace\
    \ cka-10\n  - kubectl create configmap app-config --from-literal=APP_MODE=cka -n cka-10\n  - kubectl create secret generic\
    \ app-secret --from-literal=TOKEN=training -n cka-10\n  - kubectl run env-check --image=busybox:1.36 -n cka-10 --restart=Never\
    \ --env=APP_MODE=cka --env=TOKEN=training --command\n    -- sh -c 'sleep 3600'\n  - kubectl wait --for=condition=Ready\
    \ pod/env-check -n cka-10 --timeout=90s\n  - kubectl exec -n cka-10 env-check -- printenv APP_MODE\n  - '**Conclusao e\
    \ reforco:** Ao concluir, voce deve entender como parametrizar workloads sem reconstruir imagem. Repita o\n    lab sem\
    \ copiar os comandos, depois refaca contra o relogio e anote qual comando provou que a solucao funcionou.'\n  tips:\n\
    \  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta e finalize contra\
    \ o relogio.\n  validation:\n  - command: kubectl exec -n cka-10 env-check -- printenv APP_MODE 2>/dev/null | grep -q\
    \ cka && echo ok\n    expectedOutput: ok\n    errorMessage: APP_MODE nao foi encontrado dentro do Pod.\n"
