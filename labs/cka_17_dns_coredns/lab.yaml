apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-17-dns-coredns-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-17-dns-coredns\ntitle: 'CKA 17: DNS e CoreDNS'\ndescription: Valide resolucao DNS de Services dentro\
    \ do cluster.\nduration: 25m\ntimerEnabled: true\nmaxDuration: 25m\nimage: linuxtips/girus-kind-single-node:0.1\ntype:\
    \ kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- networking\ntasks:\n- name: Resolver Services via DNS interno\
    \ do cluster\n  description: Fixar descoberta de services por nome.\n  steps:\n  - '**Objetivo de fixacao:** este lab\
    \ pratica DNS interno do cluster para fixar descoberta de Services por nome.'\n  - '**Como pensar antes de executar:**\
    \ leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor comando\n    que cria ou altera o recurso\
    \ e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos e parametros importantes:**\n\
    \n    - CoreDNS cria registros para Services e Pods.\n\n    - nslookup valida resolucao dentro de um Pod.\n\n    - Nome\
    \ curto resolve dentro do mesmo namespace.\n\n    - FQDN segue service.namespace.svc.cluster.local.'\n  - '**Referencias\
    \ oficiais para estudo:**\n\n    - https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/\n\n    - https://kubernetes.io/docs/concepts/services-networking/service/'\n\
    \  - '**Pratica:** execute os comandos abaixo e observe a saida de cada etapa. No CKA, criar o recurso e so metade do\
    \ trabalho;\n    a outra metade e provar tecnicamente que ele ficou no estado esperado.'\n  - kubectl create namespace\
    \ cka-17\n  - kubectl create deployment web-dns --image=nginx:1.25-alpine -n cka-17\n  - kubectl expose deployment web-dns\
    \ --port=80 --target-port=80 -n cka-17\n  - kubectl run dns-test --image=busybox:1.36 -n cka-17 --restart=Never --command\
    \ -- sleep 3600\n  - kubectl wait --for=condition=Ready pod/dns-test -n cka-17 --timeout=90s\n  - kubectl exec -n cka-17\
    \ dns-test -- nslookup web-dns\n  - '**Conclusao e reforco:** Ao concluir, voce deve testar conectividade separando DNS\
    \ de Service e endpoints. Repita o lab\n    sem copiar os comandos, depois refaca contra o relogio e anote qual comando\
    \ provou que a solucao funcionou.'\n  tips:\n  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando,\
    \ repita sem consulta e finalize contra o relogio.\n  validation:\n  - command: kubectl exec -n cka-17 dns-test -- nslookup\
    \ web-dns 2>/dev/null | grep -q Name && echo ok\n    expectedOutput: ok\n    errorMessage: O Pod dns-test nao resolveu\
    \ web-dns.\n"
