apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-21-boot-targets-recovery-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-21-boot-targets-recovery
data:
  lab.yaml: |
    name: rhcsa-21-boot-targets-recovery
    title: 'RHCSA 21: Boot, targets e recuperacao'
    description: Relacione targets systemd, modo rescue/emergency e recuperacao de acesso administrativo.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Troubleshooting
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Boot, targets e recuperacao'
      description: Relacione targets systemd, modo rescue/emergency e recuperacao de acesso administrativo.
      steps:
      - '**Proposta do lab:** Relacione targets systemd, modo rescue/emergency e recuperacao de acesso administrativo. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-21
      - ps -p 1 -o pid,comm,args | tee /tmp/rhcsa-21/pid1.txt
      - (systemctl get-default 2>/dev/null || echo 'target indisponivel neste container') | tee /tmp/rhcsa-21/default-target.txt
      - 'printf ''RHEL real: systemctl get-default; systemctl set-default multi-user.target; rd.break; passwd root

        '' > /tmp/rhcsa-21/recuperacao.txt'
      - '**Conclusao e reforco:** voce praticou boot, targets e recuperacao no dominio troubleshooting. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'rd.break' /tmp/rhcsa-21/recuperacao.txt && echo ok
        expectedOutput: ok
        errorMessage: O roteiro de recuperacao de boot nao foi criado.
