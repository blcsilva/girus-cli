apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-21-boot-targets-recovery-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-21-boot-targets-recovery
data:
  lab.yaml: |
    name: rhcsa-21-boot-targets-recovery
    title: 'RHCSA 21: Boot, targets e recuperacao'
    description: Relacione targets systemd, modo rescue/emergency e recuperacao de acesso administrativo.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Troubleshooting
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Boot, targets e recuperacao'
      description: Relacione targets systemd, modo rescue/emergency e recuperacao de acesso administrativo. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Relacione targets systemd, modo rescue/emergency e recuperacao de acesso administrativo. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo relacione targets systemd, modo rescue/emergency e recuperacao de acesso administrativo. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Troubleshooting. Troubleshooting exige hipotese, comando de coleta e evidencia. Nao pule direto para a correcao sem provar o sintoma.'
      - '**Ligacao com o treinamento oficial:** Este bloco aprofunda operacao real: automacao, troubleshooting, seguranca, storage, boot, rede avancada e containers com foco em resolver problemas no terminal.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''rd.break'' /tmp/rhcsa-21/recuperacao.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `ps` lista processos; selecione colunas para reduzir ruido. `systemctl` e a interface principal do systemd em RHEL real. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells.'
      - '**Aplicacao em RHEL real:** Use em incidentes: sintoma, coleta, hipotese, correcao e validacao final.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-SYSTEMD-TARGET, RHCSA-DEFAULT-TARGET, RHCSA-RESCUE, RHCSA-EMERGENCY, RHCSA-BOOT-INTERRUPT, RHCSA-ROOT-PASSWORD-RECOVERY, RHCSA-GRUB.'
      - '**Nivel da skill:** Skill Challenge. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** Documentar targets, rescue/emergency, recuperacao de senha root e bootloader.'
      - '**Cobertura EX200 reforcada:** Dominio D4 + D7 - D4 + D7. Boot, targets, interrupcao de boot, GRUB e bootloader.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-21
      - ps -p 1 -o pid,comm,args | tee /tmp/rhcsa-21/pid1.txt
      - (systemctl get-default 2>/dev/null || echo 'target indisponivel neste container') | tee /tmp/rhcsa-21/default-target.txt
      - 'printf ''RHEL real: systemctl get-default; systemctl set-default multi-user.target; rd.break; passwd root

        '' > /tmp/rhcsa-21/recuperacao.txt'
      - '**Conclusao e reforco:** voce praticou boot, targets e recuperacao no dominio troubleshooting. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'rd.break' /tmp/rhcsa-21/recuperacao.txt && echo ok
        expectedOutput: ok
        errorMessage: O roteiro de recuperacao de boot nao foi criado.
