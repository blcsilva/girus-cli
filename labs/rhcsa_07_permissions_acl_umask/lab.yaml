apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-07-permissions-acl-umask-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-07-permissions-acl-umask
data:
  lab.yaml: |
    name: rhcsa-07-permissions-acl-umask
    title: 'RHCSA 07: Permissoes, ownership e umask'
    description: Controle acesso com dono, grupo e bits numericos antes de avancar para ACL e SELinux.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Seguranca
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Permissoes, ownership e umask'
      description: Controle acesso com dono, grupo e bits numericos antes de avancar para ACL e SELinux. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Controle acesso com dono, grupo e bits numericos antes de avancar para ACL e SELinux. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo controle acesso com dono, grupo e bits numericos antes de avancar para acl e selinux. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Seguranca. Seguranca no RHCSA combina permissao UNIX, SELinux, firewall e contexto de servico. Valide sempre o controle aplicado e o sintoma esperado.'
      - '**Ligacao com o treinamento oficial:** Este bloco cobre a base operacional: localizar informacao, manipular arquivos, controlar identidades, entender processos, rede e software antes de automatizar qualquer rotina.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `stat -c ''%a'' /tmp/rhcsa-07/arquivo.txt | grep -q ''^640$'' && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells. `chmod` aplica permissoes; leia modo numerico como dono/grupo/outros. `stat` mostra metadados do arquivo, excelente para validar permissao e ownership.'
      - '**Aplicacao em RHEL real:** Use antes de expor servicos. Permissao, SELinux e firewall devem contar a mesma historia.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-PERM-RWX, RHCSA-PERM-NUMERIC, RHCSA-CHOWN, RHCSA-CHGRP, RHCSA-UMASK, RHCSA-PERM-TROUBLESHOOT.'
      - '**Nivel da skill:** Skill Guided. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** /srv/project deve permitir owner/grupo rwx, outros sem acesso, e novos arquivos rw-rw----.'
      - '**Cobertura EX200 reforcada:** Dominio D1 + D10 - D1 + D10. Permissoes ugo/rwx, ownership, umask e troubleshooting.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-07
      - 'printf ''segredo

        '' > /tmp/rhcsa-07/arquivo.txt'
      - chmod 640 /tmp/rhcsa-07/arquivo.txt
      - stat -c '%a %U %G %n' /tmp/rhcsa-07/arquivo.txt | tee /tmp/rhcsa-07/stat.txt
      - '**Conclusao e reforco:** voce praticou permissoes, ownership e umask no dominio seguranca. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: stat -c '%a' /tmp/rhcsa-07/arquivo.txt | grep -q '^640$' && echo ok
        expectedOutput: ok
        errorMessage: A permissao esperada do arquivo e 640.
