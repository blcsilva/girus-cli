apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-24-podman-containers-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-24-podman-containers
data:
  lab.yaml: |
    name: rhcsa-24-podman-containers
    title: 'RHCSA 24: Containers com Podman'
    description: Crie um Containerfile e registre comandos equivalentes de Podman usados em RHEL.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Containers
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Containers com Podman'
      description: Crie um Containerfile e registre comandos equivalentes de Podman usados em RHEL.
      steps:
      - '**Proposta do lab:** Crie um Containerfile e registre comandos equivalentes de Podman usados em RHEL. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-24/app
      - printf 'FROM registry.access.redhat.com/ubi9/ubi-minimal\nCMD ["/bin/sh", "-c", "echo rhcsa-container"]\n' > /tmp/rhcsa-24/app/Containerfile
      - (podman --version 2>/dev/null || echo 'podman indisponivel neste container') | tee /tmp/rhcsa-24/podman-version.txt
      - 'printf ''RHEL real: podman build -t app .; podman run --rm app; podman ps; podman logs

        '' > /tmp/rhcsa-24/comandos-rhel.txt'
      - '**Conclusao e reforco:** voce praticou containers com podman no dominio containers. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'FROM registry.access.redhat.com/ubi9/ubi-minimal' /tmp/rhcsa-24/app/Containerfile && echo ok
        expectedOutput: ok
        errorMessage: O Containerfile UBI nao foi criado.
