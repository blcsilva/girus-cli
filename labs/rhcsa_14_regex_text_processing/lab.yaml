apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-14-regex-text-processing-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-14-regex-text-processing
data:
  lab.yaml: |
    name: rhcsa-14-regex-text-processing
    title: 'RHCSA 14: Expressoes regulares aplicadas'
    description: Use regex para extrair informacao operacional de textos e logs.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Automacao
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Expressoes regulares aplicadas'
      description: Use regex para extrair informacao operacional de textos e logs.
      steps:
      - '**Proposta do lab:** Use regex para extrair informacao operacional de textos e logs. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - 'printf ''user=ana uid=1001

        user=bruno uid=1002

        service=sshd port=22

        '' > /tmp/rhcsa-14.txt'
      - grep -E 'uid=[0-9]+' /tmp/rhcsa-14.txt | tee /tmp/rhcsa-14-users.txt
      - sed -nE 's/user=([^ ]+) uid=([0-9]+)/\1:\2/p' /tmp/rhcsa-14.txt | tee /tmp/rhcsa-14-map.txt
      - '**Conclusao e reforco:** voce praticou expressoes regulares aplicadas no dominio automacao. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'bruno:1002' /tmp/rhcsa-14-map.txt && echo ok
        expectedOutput: ok
        errorMessage: A extracao com regex nao encontrou bruno:1002.
