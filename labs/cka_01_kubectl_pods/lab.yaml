apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-01-kubectl-pods-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-01-kubectl-pods\ntitle: 'CKA 01: Pods e kubectl essencial'\ndescription: Crie Pods rapidamente, inspecione\
    \ status, eventos e detalhes com kubectl.\nduration: 20m\ntimerEnabled: true\nmaxDuration: 20m\nimage: linuxtips/girus-kind-single-node:0.1\n\
    type: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- kubectl\ntasks:\n- name: Criar, inspecionar e validar Pods\
    \ com kubectl\n  description: Fixar que o pod e a menor unidade executavel do kubernetes e que voce deve sempre provar\
    \ o estado final com\n    get, wait e describe.\n  steps:\n  - '**Objetivo de fixacao:** este lab pratica Pod e o fluxo\
    \ basico do kubectl para fixar que o Pod e a menor unidade executavel\n    do Kubernetes e que voce deve sempre provar\
    \ o estado final com get, wait e describe.'\n  - '**Como pensar antes de executar:** leia o enunciado, identifique o recurso\
    \ Kubernetes envolvido, execute o menor comando\n    que cria ou altera o recurso e valide o estado final com `get`, `describe`,\
    \ `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos e parametros importantes:**\n\n    - kubectl run NAME cria rapidamente\
    \ um Pod a partir de uma imagem.\n\n    - --image define a imagem do container.\n\n    - -n escolhe o namespace alvo.\n\
    \n    - kubectl wait --for=condition=Ready espera a condicao Ready antes da validacao.\n\n    - kubectl describe mostra\
    \ eventos, scheduling, imagem e detalhes do Pod.'\n  - '**Referencias oficiais para estudo:**\n\n    - https://kubernetes.io/docs/concepts/workloads/pods/\n\
    \n    - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/\n\n    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/\n\
    \n    - https://kubernetes.io/docs/reference/kubectl/quick-reference/'\n  - '**Pratica:** execute os comandos abaixo e\
    \ observe a saida de cada etapa. No CKA, criar o recurso e so metade do trabalho;\n    a outra metade e provar tecnicamente\
    \ que ele ficou no estado esperado.'\n  - kubectl create namespace cka-01\n  - kubectl run nginx --image=nginx:1.25-alpine\
    \ -n cka-01\n  - kubectl wait --for=condition=Ready pod/nginx -n cka-01 --timeout=90s\n  - kubectl get pod nginx -n cka-01\
    \ -o wide\n  - kubectl describe pod nginx -n cka-01\n  - '**Conclusao e reforco:** Ao concluir, voce deve saber criar\
    \ um Pod simples, esperar readiness e diagnosticar o estado\n    usando comandos de leitura antes de avancar. Repita o\
    \ lab sem copiar os comandos, depois refaca contra o relogio e anote\n    qual comando provou que a solucao funcionou.'\n\
    \  tips:\n  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta e finalize\
    \ contra o relogio.\n  validation:\n  - command: kubectl get pod nginx -n cka-01 -o jsonpath='{.status.phase}' 2>/dev/null\
    \ | grep -q Running && echo ok\n    expectedOutput: ok\n    errorMessage: O Pod nginx nao esta Running.\n"
