apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-01-rhel-ecosystem-cli-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-01-rhel-ecosystem-cli
data:
  lab.yaml: |
    name: rhcsa-01-rhel-ecosystem-cli
    title: 'RHCSA 01: Introducao ao RHEL e shell'
    description: Mapeie distribuicao, kernel, shell e contexto de execucao antes de administrar um servidor.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Fundamentos
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Introducao ao RHEL e shell'
      description: Mapeie distribuicao, kernel, shell e contexto de execucao antes de administrar um servidor. Este lab detalha cenario, comandos, criterios de validacao e aplicacao pratica em RHEL.
      steps:
      - '**Proposta do lab:** Mapeie distribuicao, kernel, shell e contexto de execucao antes de administrar um servidor. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo mapeie distribuicao, kernel, shell e contexto de execucao antes de administrar um servidor. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Fundamentos. Use este dominio para criar memoria muscular de shell. Em prova pratica, perder tempo identificando ambiente, usuario ou caminho custa mais do que o comando em si.'
      - '**Ligacao com o treinamento oficial:** Este bloco cobre a base operacional: localizar informacao, manipular arquivos, controlar identidades, entender processos, rede e software antes de automatizar qualquer rotina.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -Eq ''ID=|NAME='' /tmp/rhcsa-01-report.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `cat` exibe conteudo; com `tee`, tambem grava a evidencia em arquivo. `uname -a` mostra kernel, arquitetura e dados uteis para diagnostico inicial. `echo` registra variaveis e mensagens simples; use expansao defensiva como `${SHELL:-/bin/sh}` quando a variavel pode nao existir. `whoami` confirma a identidade efetiva antes de alterar arquivos ou permissoes.'
      - '**Aplicacao em RHEL real:** Em um servidor novo, execute este roteiro antes de instalar pacote ou alterar configuracao. Ele cria uma fotografia minima do ambiente.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - cat /etc/os-release | tee /tmp/rhcsa-01-report.txt
      - uname -a | tee -a /tmp/rhcsa-01-report.txt
      - echo SHELL=${SHELL:-/bin/sh} | tee -a /tmp/rhcsa-01-report.txt
      - whoami | tee -a /tmp/rhcsa-01-report.txt
      - '**Conclusao e reforco:** voce praticou introducao ao rhel e shell no dominio fundamentos. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -Eq 'ID=|NAME=' /tmp/rhcsa-01-report.txt && echo ok
        expectedOutput: ok
        errorMessage: Voce nao gerou o relatorio basico do sistema.
