apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-03-filesystem-navigation-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-03-filesystem-navigation
data:
  lab.yaml: |
    name: rhcsa-03-filesystem-navigation
    title: 'RHCSA 03: Hierarquia, caminhos absolutos e relativos'
    description: Navegue pela FHS, diferencie caminhos absolutos e relativos e localize arquivos com seguranca.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Arquivos
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Hierarquia, caminhos absolutos e relativos'
      description: Navegue pela FHS, diferencie caminhos absolutos e relativos e localize arquivos com seguranca. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Navegue pela FHS, diferencie caminhos absolutos e relativos e localize arquivos com seguranca. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo navegue pela fhs, diferencie caminhos absolutos e relativos e localize arquivos com seguranca. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Arquivos. Arquivos sao a unidade de configuracao mais comum em Linux. Pratique sempre criando evidencia antes e depois da alteracao.'
      - '**Ligacao com o treinamento oficial:** Este bloco cobre a base operacional: localizar informacao, manipular arquivos, controlar identidades, entender processos, rede e software antes de automatizar qualquer rotina.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''./conf/app.conf'' /tmp/rhcsa-03/arquivos.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `touch` cria arquivo vazio ou atualiza timestamp; bom para preparar estrutura de teste. `cd` muda contexto; combine com `pwd` para provar onde voce esta.'
      - '**Aplicacao em RHEL real:** Use em mudancas de configuracao: crie diretorio, copie arquivo, edite, valide e mantenha evidencia do resultado.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-FHS-01, RHCSA-PATH-01, RHCSA-PATH-02, RHCSA-FIND-01, RHCSA-LINK-01, RHCSA-LINK-02.'
      - '**Nivel da skill:** Skill Guided. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** Organizar estrutura e reconhecer quando usar arquivo, diretorio, hard link ou link simbolico.'
      - '**Cobertura EX200 reforcada:** Dominio D1 - Essential Tools. FHS, caminhos absolutos/relativos, find e links hard/soft.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-03/projeto/conf /tmp/rhcsa-03/projeto/logs /tmp/rhcsa-03/projeto/dados
      - touch /tmp/rhcsa-03/projeto/conf/app.conf
      - cd /tmp/rhcsa-03/projeto && pwd > /tmp/rhcsa-03/pwd.txt
      - cd /tmp/rhcsa-03/projeto && find . -maxdepth 2 -type f | sort > /tmp/rhcsa-03/arquivos.txt
      - '**Conclusao e reforco:** voce praticou hierarquia, caminhos absolutos e relativos no dominio arquivos. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q './conf/app.conf' /tmp/rhcsa-03/arquivos.txt && echo ok
        expectedOutput: ok
        errorMessage: O arquivo app.conf nao foi localizado no caminho esperado.
