apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-17-selinux-basics-contexts-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-17-selinux-basics-contexts
data:
  lab.yaml: |
    name: rhcsa-17-selinux-basics-contexts
    title: 'RHCSA 17: SELinux, modos e contextos'
    description: Reconheca modo, contexto e comandos de correcao SELinux mesmo em ambiente de lab sem SELinux ativo.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Seguranca
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: SELinux, modos e contextos'
      description: Reconheca modo, contexto e comandos de correcao SELinux mesmo em ambiente de lab sem SELinux ativo. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Reconheca modo, contexto e comandos de correcao SELinux mesmo em ambiente de lab sem SELinux ativo. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo reconheca modo, contexto e comandos de correcao selinux mesmo em ambiente de lab sem selinux ativo. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Seguranca. Seguranca no RHCSA combina permissao UNIX, SELinux, firewall e contexto de servico. Valide sempre o controle aplicado e o sintoma esperado.'
      - '**Ligacao com o treinamento oficial:** Este bloco aprofunda operacao real: automacao, troubleshooting, seguranca, storage, boot, rede avancada e containers com foco em resolver problemas no terminal.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''restorecon'' /tmp/rhcsa-17/comandos-rhel.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `touch` cria arquivo vazio ou atualiza timestamp; bom para preparar estrutura de teste. `getenforce` aparece neste lab como parte do roteiro pratico; observe entrada, saida e arquivo alterado. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells.'
      - '**Aplicacao em RHEL real:** Use antes de expor servicos. Permissao, SELinux e firewall devem contar a mesma historia.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-SELINUX-STATUS, RHCSA-SELINUX-ENFORCING, RHCSA-SELINUX-PERMISSIVE, RHCSA-SELINUX-CONTEXT, RHCSA-RESTORECON, RHCSA-SEMANAGE-FCONTEXT, RHCSA-SEMANAGE-PORT, RHCSA-SELINUX-BOOLEAN.'
      - '**Nivel da skill:** Skill Challenge. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** Reconhecer modo SELinux, contexto, restorecon, port label e boolean.'
      - '**Cobertura EX200 reforcada:** Dominio D10 - Security. SELinux: modos, contextos, port labels e booleans.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-17/web
      - touch /tmp/rhcsa-17/web/index.html
      - (getenforce 2>/dev/null || echo 'SELinux indisponivel neste container') | tee /tmp/rhcsa-17/mode.txt
      - 'printf ''RHEL real: getenforce; sestatus; ls -Z; semanage fcontext; restorecon -Rv

        '' > /tmp/rhcsa-17/comandos-rhel.txt'
      - '**Conclusao e reforco:** voce praticou selinux, modos e contextos no dominio seguranca. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'restorecon' /tmp/rhcsa-17/comandos-rhel.txt && echo ok
        expectedOutput: ok
        errorMessage: O roteiro de SELinux nao foi criado.
