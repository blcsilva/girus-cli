apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-06-node-maintenance-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-06-node-maintenance\ntitle: 'CKA 06: manutencao segura de node'\ndescription: Pratique cordon e uncordon\
    \ em ambiente single-node sem executar drain destrutivo.\nduration: 25m\ntimerEnabled: true\nmaxDuration: 25m\nimage:\
    \ linuxtips/girus-kind-single-node:0.1\ntype: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- cluster\ntasks:\n\
    - name: Controlar scheduling com cordon e uncordon\n  description: Fixar a diferenca entre impedir novos agendamentos\
    \ e remover pods existentes.\n  steps:\n  - '**Objetivo de fixacao:** este lab pratica manutencao de node com cordon e\
    \ uncordon para fixar a diferenca entre impedir\n    novos agendamentos e remover Pods existentes.'\n  - '**Como pensar\
    \ antes de executar:** leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor comando\n    que\
    \ cria ou altera o recurso e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos\
    \ e parametros importantes:**\n\n    - kubectl cordon marca o node como unschedulable.\n\n    - kubectl uncordon libera\
    \ novos agendamentos.\n\n    - jsonpath extrai campos especificos do objeto Node.\n\n    - Neste ambiente single-node\
    \ nao usamos drain para evitar interromper tudo.'\n  - '**Referencias oficiais para estudo:**\n\n    - https://kubernetes.io/docs/reference/kubectl/quick-reference/\n\
    \n    - https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/'\n  - '**Pratica:** execute os comandos\
    \ abaixo e observe a saida de cada etapa. No CKA, criar o recurso e so metade do trabalho;\n    a outra metade e provar\
    \ tecnicamente que ele ficou no estado esperado.'\n  - NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')\n\
    \  - kubectl cordon $NODE\n  - kubectl get nodes\n  - kubectl uncordon $NODE\n  - kubectl get nodes\n  - '**Conclusao\
    \ e reforco:** Ao concluir, voce deve saber pausar e liberar scheduling em um node com seguranca. Repita o\n    lab sem\
    \ copiar os comandos, depois refaca contra o relogio e anote qual comando provou que a solucao funcionou.'\n  tips:\n\
    \  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta e finalize contra\
    \ o relogio.\n  validation:\n  - command: NODE=girus-control-plane; kubectl get node  -o jsonpath='{.spec.unschedulable}'\
    \ 2>/dev/null | grep -q '^$' &&\n      echo ok\n    expectedOutput: ok\n    errorMessage: O node ainda esta unschedulable.\n"
