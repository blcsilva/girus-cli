apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-12-resources-quotas-limits-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-12-resources-quotas-limits\ntitle: 'CKA 12: requests, limits e quotas'\ndescription: Aplique LimitRange\
    \ e ResourceQuota para controlar consumo de namespace.\nduration: 25m\ntimerEnabled: true\nmaxDuration: 25m\nimage: linuxtips/girus-kind-single-node:0.1\n\
    type: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- workloads\ntasks:\n- name: Definir requests, limits e ResourceQuota\n\
    \  description: Fixar controle de consumo de cpu/memoria no namespace.\n  steps:\n  - '**Objetivo de fixacao:** este lab\
    \ pratica requests, limits e ResourceQuota para fixar controle de consumo de CPU/memoria\n    no namespace.'\n  - '**Como\
    \ pensar antes de executar:** leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor comando\n\
    \    que cria ou altera o recurso e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos\
    \ e parametros importantes:**\n\n    - ResourceQuota limita consumo agregado no namespace.\n\n    - requests reservam\
    \ recursos para scheduling.\n\n    - limits definem teto de uso do container.\n\n    - kubectl set resources altera requests/limits\
    \ em workloads existentes.'\n  - '**Referencias oficiais para estudo:**\n\n    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/'\n\
    \  - '**Pratica:** execute os comandos abaixo e observe a saida de cada etapa. No CKA, criar o recurso e so metade do\
    \ trabalho;\n    a outra metade e provar tecnicamente que ele ficou no estado esperado.'\n  - kubectl create namespace\
    \ cka-12\n  - kubectl create quota compute-quota --hard=pods=4,requests.cpu=500m,limits.cpu=1 -n cka-12\n  - kubectl create\
    \ deployment limited-web --image=nginx:1.25-alpine -n cka-12\n  - kubectl set resources deployment limited-web --requests=cpu=100m,memory=64Mi\
    \ --limits=cpu=200m,memory=128Mi -n cka-12\n  - kubectl describe quota compute-quota -n cka-12\n  - '**Conclusao e reforco:**\
    \ Ao concluir, voce deve saber impor limites e explicar por que requests influenciam scheduling.\n    Repita o lab sem\
    \ copiar os comandos, depois refaca contra o relogio e anote qual comando provou que a solucao funcionou.'\n  tips:\n\
    \  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta e finalize contra\
    \ o relogio.\n  validation:\n  - command: kubectl get resourcequota compute-quota -n cka-12 -o jsonpath='{.spec.hard.pods}'\
    \ 2>/dev/null | grep -q 4 &&\n      echo ok\n    expectedOutput: ok\n    errorMessage: A ResourceQuota compute-quota nao\
    \ foi criada.\n"
