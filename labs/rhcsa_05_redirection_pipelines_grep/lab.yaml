apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-05-redirection-pipelines-grep-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-05-redirection-pipelines-grep
data:
  lab.yaml: |
    name: rhcsa-05-redirection-pipelines-grep
    title: 'RHCSA 05: Redirecionamento, pipes e grep'
    description: Combine filtros e redirecionamento para transformar saidas de comandos em evidencia verificavel.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Shell
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Redirecionamento, pipes e grep'
      description: Combine filtros e redirecionamento para transformar saidas de comandos em evidencia verificavel. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Combine filtros e redirecionamento para transformar saidas de comandos em evidencia verificavel. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo combine filtros e redirecionamento para transformar saidas de comandos em evidencia verificavel. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Shell. O shell permite transformar saida em prova. Pipes e redirecionamentos ajudam a validar sem depender de interpretacao visual.'
      - '**Ligacao com o treinamento oficial:** Este bloco cobre a base operacional: localizar informacao, manipular arquivos, controlar identidades, entender processos, rede e software antes de automatizar qualquer rotina.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''^2$'' /tmp/rhcsa-05-count.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells. `grep` filtra texto; `-E` habilita regex estendida e `-q` valida silenciosamente. `cat` exibe conteudo; com `tee`, tambem grava a evidencia em arquivo.'
      - '**Aplicacao em RHEL real:** Use em triagem de logs e saidas longas. O objetivo e reduzir milhares de linhas a uma resposta verificavel.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-STDOUT, RHCSA-STDERR, RHCSA-REDIRECT-OVERWRITE, RHCSA-REDIRECT-APPEND, RHCSA-PIPE, RHCSA-GREP, RHCSA-REGEX-BASIC.'
      - '**Nivel da skill:** Skill Guided. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** Produzir /tmp/errors.txt a partir de log, separando stdout, stderr e filtros.'
      - '**Cobertura EX200 reforcada:** Dominio D1 - Essential Tools. Redirecionamento, grep e regex para analise de texto.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - 'printf ''error api

        info web

        error db

        '' > /tmp/rhcsa-05.log'
      - grep '^error' /tmp/rhcsa-05.log | tee /tmp/rhcsa-05-errors.log
      - grep -c '^error' /tmp/rhcsa-05.log > /tmp/rhcsa-05-count.txt
      - cat /tmp/rhcsa-05-count.txt
      - '**Conclusao e reforco:** voce praticou redirecionamento, pipes e grep no dominio shell. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q '^2$' /tmp/rhcsa-05-count.txt && echo ok
        expectedOutput: ok
        errorMessage: A contagem de linhas com erro deveria ser 2.
