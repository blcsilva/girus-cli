apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-13-scheduling-nodeselector-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-13-scheduling-nodeselector\ntitle: 'CKA 13: scheduling com nodeSelector'\ndescription: Use labels de\
    \ node e nodeSelector para influenciar agendamento.\nduration: 25m\ntimerEnabled: true\nmaxDuration: 25m\nimage: linuxtips/girus-kind-single-node:0.1\n\
    type: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- workloads\ntasks:\n- name: Agendar Pods usando labels e nodeSelector\n\
    \  description: Fixar controle simples de onde um pod pode ser agendado.\n  steps:\n  - '**Objetivo de fixacao:** este\
    \ lab pratica scheduling com labels e nodeSelector para fixar controle simples de onde um\n    Pod pode ser agendado.'\n\
    \  - '**Como pensar antes de executar:** leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor\
    \ comando\n    que cria ou altera o recurso e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n\
    \  - '**Comandos e parametros importantes:**\n\n    - kubectl label node adiciona metadados ao Node.\n\n    - --overwrite\
    \ permite atualizar label existente.\n\n    - nodeSelector exige que o Node possua a label informada.\n\n    - --overrides\
    \ injeta JSON no manifesto gerado pelo kubectl run.'\n  - '**Referencias oficiais para estudo:**\n\n    - https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/\n\
    \n    - https://kubernetes.io/docs/concepts/workloads/pods/'\n  - '**Pratica:** execute os comandos abaixo e observe a\
    \ saida de cada etapa. No CKA, criar o recurso e so metade do trabalho;\n    a outra metade e provar tecnicamente que\
    \ ele ficou no estado esperado.'\n  - kubectl create namespace cka-13\n  - NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')\n\
    \  - kubectl label node $NODE cka-disk=ssd --overwrite\n  - kubectl run scheduled-pod --image=busybox:1.36 -n cka-13 --restart=Never\
    \ --overrides='{\"spec\":{\"nodeSelector\":{\"cka-disk\":\"ssd\"},\"containers\":[{\"name\":\"scheduled-pod\",\"image\"\
    :\"busybox:1.36\",\"command\":[\"sh\",\"-c\",\"sleep\n    3600\"]}]}}'\n  - kubectl get pod scheduled-pod -n cka-13 -o\
    \ wide\n  - '**Conclusao e reforco:** Ao concluir, voce deve saber forcar agendamento por label e confirmar o selector\
    \ no Pod. Repita\n    o lab sem copiar os comandos, depois refaca contra o relogio e anote qual comando provou que a solucao\
    \ funcionou.'\n  tips:\n  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta\
    \ e finalize contra o relogio.\n  validation:\n  - command: kubectl get pod scheduled-pod -n cka-13 -o jsonpath='{.spec.nodeSelector.cka-disk}'\
    \ 2>/dev/null | grep -q ssd\n      && echo ok\n    expectedOutput: ok\n    errorMessage: O Pod scheduled-pod nao tem nodeSelector\
    \ cka-disk=ssd.\n"
