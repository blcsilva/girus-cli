apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-26-rhcsa-comprehensive-review-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-26-rhcsa-comprehensive-review
data:
  lab.yaml: |
    name: rhcsa-26-rhcsa-comprehensive-review
    title: 'RHCSA 26: revisao integrada RHCSA'
    description: Treine uma revisao integrada de dominios RHCSA com validacao objetiva.
    duration: 45m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Revisao
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: revisao integrada RHCSA'
      description: Treine uma revisao integrada de dominios RHCSA com validacao objetiva. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Execute uma mini-revisao integrando arquivos, usuarios, permissoes, processos, logs e plano operacional. Este exercicio pertence ao bloco RH200, alinhado a revisao acelerada RHCSA/RH199: consolidacao de RH124 e RH134 com foco operacional.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH200 - https://www.redhat.com/en/services/training/rh200-red-hat-certified-system-administrator-rapid-track-course-exam'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo execute uma mini-revisao integrando arquivos, usuarios, permissoes, processos, logs e plano operacional. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Revisao. Revisao integrada treina alternancia de assuntos. O objetivo e sair do modo tutorial e executar com criterio de prova.'
      - '**Ligacao com o treinamento oficial:** Este bloco consolida RH124 e RH134 em ritmo de prova: executar, validar, explicar o efeito do comando e reconhecer rapidamente o proximo diagnostico.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''RHCSA revisao final'' /tmp/rhcsa-26/revisao/summary.txt && stat -c ''%a'' /tmp/rhcsa-26/revisao/summary.txt | grep -q ''^640$'' && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells. `chmod` aplica permissoes; leia modo numerico como dono/grupo/outros. `sleep` cria processo controlado para treino de `ps`, PID e sinais. `ps` lista processos; selecione colunas para reduzir ruido.'
      - '**Aplicacao em RHEL real:** Use como simulado curto: alterne assuntos e valide cada entrega antes de seguir.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-INTEGRATION-01, RHCSA-SIM-REVIEW, RHCSA-SIM-VALIDATION.'
      - '**Nivel da skill:** Skill Exam. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** Usar a revisao integrada como mini EX200 conceitual: cenario, decisao, execucao possivel e validacao.'
      - '**Cobertura EX200 reforcada:** Dominio D1-D10 - D1-D10. Revisao integrada com pressao de tempo, checklist e validacao objetiva.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-26/revisao
      - 'printf ''RHCSA revisao final

        usuarios arquivos rede storage seguranca

        '' > /tmp/rhcsa-26/revisao/summary.txt'
      - chmod 640 /tmp/rhcsa-26/revisao/summary.txt
      - sleep 120 & echo $! > /tmp/rhcsa-26/revisao/process.pid
      - ps -p $(cat /tmp/rhcsa-26/revisao/process.pid) -o pid,comm >> /tmp/rhcsa-26/revisao/summary.txt
      - '**Adendo de reforco:** Este e o treino de revisao: cenario primeiro, comandos depois. Priorize persistencia, validacao e decisao tecnica sob tempo.'
      - '**Conclusao e reforco:** voce praticou revisao integrada rhcsa no dominio revisao. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'RHCSA revisao final' /tmp/rhcsa-26/revisao/summary.txt && stat -c '%a' /tmp/rhcsa-26/revisao/summary.txt | grep -q '^640$' && echo ok
        expectedOutput: ok
        errorMessage: A revisao final nao contem conteudo/permissao esperados.
