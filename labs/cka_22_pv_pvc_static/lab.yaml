apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-22-pv-pvc-static-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-22-pv-pvc-static\ntitle: 'CKA 22: PV e PVC estatico'\ndescription: Crie PV hostPath e PVC com bind\
    \ explicito por volumeName.\nduration: 30m\ntimerEnabled: true\nmaxDuration: 30m\nimage: linuxtips/girus-kind-single-node:0.1\n\
    type: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- storage\ntasks:\n- name: Vincular PV e PVC de forma estatica\n\
    \  description: Fixar bind manual entre persistentvolume e persistentvolumeclaim.\n  steps:\n  - '**Objetivo de fixacao:**\
    \ este lab pratica PV e PVC estatico para fixar bind manual entre PersistentVolume e PersistentVolumeClaim.'\n  - '**Como\
    \ pensar antes de executar:** leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor comando\n\
    \    que cria ou altera o recurso e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos\
    \ e parametros importantes:**\n\n    - PersistentVolume representa armazenamento disponivel no cluster.\n\n    - hostPath\
    \ e atalho de laboratorio, nao recomendacao geral de producao.\n\n    - volumeName forca o PVC a tentar usar um PV especifico.\n\
    \n    - persistentVolumeReclaimPolicy define comportamento apos liberar o claim.'\n  - '**Referencias oficiais para estudo:**\n\
    \n    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/\n\n    - https://kubernetes.io/docs/concepts/storage/volumes/'\n\
    \  - '**Pratica:** execute os comandos abaixo e observe a saida de cada etapa. No CKA, criar o recurso e so metade do\
    \ trabalho;\n    a outra metade e provar tecnicamente que ele ficou no estado esperado.'\n  - kubectl create namespace\
    \ cka-22\n  - \"kubectl apply -f - <<EOF\\napiVersion: v1\\nkind: PersistentVolume\\nmetadata:\\n  name: cka-22-pv\\nspec:\\\
    n  capacity:\\n\\\n    \\    storage: 1Gi\\n  accessModes:\\n  - ReadWriteOnce\\n  persistentVolumeReclaimPolicy: Retain\\\
    n  hostPath:\\n    path:\\\n    \\ /tmp/cka-22-pv\\n---\\napiVersion: v1\\nkind: PersistentVolumeClaim\\nmetadata:\\n\
    \  name: cka-22-pvc\\n  namespace: cka-22\\n\\\n    spec:\\n  accessModes:\\n  - ReadWriteOnce\\n  resources:\\n    requests:\\\
    n      storage: 512Mi\\n  volumeName: cka-22-pv\\n\\\n    EOF\\n\"\n  - kubectl get pv cka-22-pv\n  - kubectl get pvc\
    \ cka-22-pvc -n cka-22\n  - '**Conclusao e reforco:** Ao concluir, voce deve saber criar PV/PVC estatico e confirmar fase\
    \ Bound. Repita o lab sem\n    copiar os comandos, depois refaca contra o relogio e anote qual comando provou que a solucao\
    \ funcionou.'\n  tips:\n  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta\
    \ e finalize contra o relogio.\n  validation:\n  - command: kubectl get pvc cka-22-pvc -n cka-22 -o jsonpath='{.status.phase}'\
    \ 2>/dev/null | grep -q Bound && echo ok\n    expectedOutput: ok\n    errorMessage: O PVC cka-22-pvc nao esta Bound.\n"
