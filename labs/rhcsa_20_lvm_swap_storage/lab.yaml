apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-20-lvm-swap-storage-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-20-lvm-swap-storage
data:
  lab.yaml: |
    name: rhcsa-20-lvm-swap-storage
    title: 'RHCSA 20: LVM, swap e crescimento de volumes'
    description: Pratique o raciocinio de PV, VG, LV, filesystem e swap com um plano operacional validavel.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Storage
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: LVM, swap e crescimento de volumes'
      description: Pratique o raciocinio de PV, VG, LV, filesystem e swap com um plano operacional validavel. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Pratique o raciocinio de PV, VG, LV, filesystem e swap com um plano operacional validavel. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo pratique o raciocinio de pv, vg, lv, filesystem e swap com um plano operacional validavel. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Storage. Storage exige cuidado porque comandos reais podem destruir dados. No lab, o roteiro e controlado; em RHEL real, confirme dispositivo, filesystem e persistencia.'
      - '**Ligacao com o treinamento oficial:** Este bloco aprofunda operacao real: automacao, troubleshooting, seguranca, storage, boot, rede avancada e containers com foco em resolver problemas no terminal.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''lvcreate'' /tmp/rhcsa-20/plano-lvm.txt && grep -q ''swapon'' /tmp/rhcsa-20/plano-lvm.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells. `cat` exibe conteudo; com `tee`, tambem grava a evidencia em arquivo.'
      - '**Aplicacao em RHEL real:** Use em expansao de discos, filesystems e montagens. Confirme backup e dispositivo antes de executar em producao.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-LVM-PV, RHCSA-LVM-VG, RHCSA-LVM-LV, RHCSA-LVM-EXTEND, RHCSA-XFS-GROW, RHCSA-RESIZE2FS, RHCSA-SWAP-CREATE, RHCSA-SWAPON, RHCSA-SWAP-PERSIST.'
      - '**Nivel da skill:** Skill Challenge. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** Modelar /dev/vdb -> PV -> vg_data -> lv_app -> XFS -> /srv/app e expansao 1 GiB para 2 GiB.'
      - '**Cobertura EX200 reforcada:** Dominio D5 + D6 - D5 + D6. LVM, swap, extensao de LV e crescimento de XFS/ext4.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-20
      - printf 'pvcreate /dev/vdb\nvgcreate vg_data /dev/vdb\nlvcreate -n lv_app -L 1G vg_data\nmkfs.xfs /dev/vg_data/lv_app\nmount /dev/vg_data/lv_app /app\nmkswap /dev/vg_data/lv_swap\nswapon /dev/vg_data/lv_swap\n' > /tmp/rhcsa-20/plano-lvm.txt
      - cat /tmp/rhcsa-20/plano-lvm.txt
      - '**Conclusao e reforco:** voce praticou lvm, swap e crescimento de volumes no dominio storage. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'lvcreate' /tmp/rhcsa-20/plano-lvm.txt && grep -q 'swapon' /tmp/rhcsa-20/plano-lvm.txt && echo ok
        expectedOutput: ok
        errorMessage: O plano de LVM/swap nao contem os comandos esperados.
