apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-02-help-docs-man-pages-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-02-help-docs-man-pages
data:
  lab.yaml: |
    name: rhcsa-02-help-docs-man-pages
    title: 'RHCSA 02: Ajuda local, man e --help'
    description: Use documentacao local para resolver duvidas sem sair do terminal, habilidade essencial no RHCSA.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Fundamentos
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Ajuda local, man e --help'
      description: Use documentacao local para resolver duvidas sem sair do terminal, habilidade essencial no RHCSA. Este lab incorpora adendos EX200 RHEL 10 mantendo o formato GIRUS atual.
      steps:
      - '**Proposta do lab:** Use documentacao local para resolver duvidas sem sair do terminal, habilidade essencial no RHCSA. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo use documentacao local para resolver duvidas sem sair do terminal, habilidade essencial no rhcsa. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Fundamentos. Use este dominio para criar memoria muscular de shell. Em prova pratica, perder tempo identificando ambiente, usuario ou caminho custa mais do que o comando em si.'
      - '**Ligacao com o treinamento oficial:** Este bloco cobre a base operacional: localizar informacao, manipular arquivos, controlar identidades, entender processos, rede e software antes de automatizar qualquer rotina.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `test -s /tmp/rhcsa-02/ls-help.txt && grep -Eq ''Usage|Uso'' /tmp/rhcsa-02/ls-help.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `ls` aparece neste lab como parte do roteiro pratico; observe entrada, saida e arquivo alterado. `cp` copia mantendo origem; valide destino antes de editar. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells.'
      - '**Aplicacao em RHEL real:** Em um servidor novo, execute este roteiro antes de instalar pacote ou alterar configuracao. Ele cria uma fotografia minima do ambiente.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Skill IDs EX200:** RHCSA-DOC-01, RHCSA-DOC-02, RHCSA-DOC-03, RHCSA-DOC-04, RHCSA-DOC-05.'
      - '**Nivel da skill:** Skill Guided. Guided permite copiar e entender; Challenge exige escolher comandos; Exam entrega cenario e validacao com minima ajuda.'
      - '**Fases de aprendizagem:** FASE 1 - Descoberta: levante estado atual. FASE 2 - Execucao: aplique a menor mudanca necessaria. FASE 3 - Validacao: use a validacao automatica e comandos de conferencia. FASE 4 - Reforco: altere mentalmente um requisito e explique como adaptaria a solucao.'
      - '**Estado desejado ampliado:** Resolver duvidas usando documentacao local: man, info, --help e /usr/share/doc.'
      - '**Cobertura EX200 reforcada:** Dominio D1 - Essential Tools. Documentacao local, importante porque o exame nao fornece internet.'
      - '**Referencia EX200:** objetivos oficiais do Red Hat Certified System Administrator exam em RHEL 10 - https://www.redhat.com/en/services/training/ex200-red-hat-certified-system-administrator-rhcsa-exam'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-02
      - ls --help > /tmp/rhcsa-02/ls-help.txt
      - cp --help > /tmp/rhcsa-02/cp-help.txt
      - 'printf ''man ls; ls --help; /usr/share/doc quando disponivel

        '' > /tmp/rhcsa-02/fontes.txt'
      - '**Conclusao e reforco:** voce praticou ajuda local, man e --help no dominio fundamentos. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: test -s /tmp/rhcsa-02/ls-help.txt && grep -Eq 'Usage|Uso' /tmp/rhcsa-02/ls-help.txt && echo ok
        expectedOutput: ok
        errorMessage: O arquivo de ajuda do comando ls nao foi criado.
