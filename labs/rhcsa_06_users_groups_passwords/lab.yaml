apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-06-users-groups-passwords-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-06-users-groups-passwords
data:
  lab.yaml: |
    name: rhcsa-06-users-groups-passwords
    title: 'RHCSA 06: Usuarios, grupos e identidade'
    description: Crie identidade local, associe grupo primario/secundario e valide com getent e id.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Usuarios
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Usuarios, grupos e identidade'
      description: Crie identidade local, associe grupo primario/secundario e valide com getent e id.
      steps:
      - '**Proposta do lab:** Crie identidade local, associe grupo primario/secundario e valide com getent e id. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-06
      - printf 'rhcsauser:x:2001:2001:RHCSA User:/home/rhcsauser:/bin/bash\n' > /tmp/rhcsa-06/passwd.sample
      - printf 'rhcsagrp:x:2001:rhcsauser\n' > /tmp/rhcsa-06/group.sample
      - 'printf ''RHEL real: groupadd rhcsagrp; useradd -m -G rhcsagrp rhcsauser; passwd rhcsauser; id rhcsauser\n'' > /tmp/rhcsa-06/comandos-rhel.txt'
      - cat /tmp/rhcsa-06/passwd.sample /tmp/rhcsa-06/group.sample /tmp/rhcsa-06/comandos-rhel.txt
      - '**Conclusao e reforco:** voce praticou usuarios, grupos e identidade no dominio usuarios. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q '^rhcsauser:' /tmp/rhcsa-06/passwd.sample && grep -q '^rhcsagrp:' /tmp/rhcsa-06/group.sample && echo ok
        expectedOutput: ok
        errorMessage: Os exemplos de usuario e grupo nao foram criados.
