apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-13-shell-scripting-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-13-shell-scripting
data:
  lab.yaml: |
    name: rhcsa-13-shell-scripting
    title: 'RHCSA 13: Shell scripting para administracao'
    description: Escreva script simples com variaveis, codigo de saida e saida previsivel.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Automacao
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Shell scripting para administracao'
      description: Escreva script simples com variaveis, codigo de saida e saida previsivel.
      steps:
      - '**Proposta do lab:** Escreva script simples com variaveis, codigo de saida e saida previsivel. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - printf '#!/bin/sh\nset -eu\nname=${1:-rhcsa}\necho treinamento-$name\n' > /tmp/rhcsa-13.sh
      - chmod +x /tmp/rhcsa-13.sh
      - /tmp/rhcsa-13.sh shell | tee /tmp/rhcsa-13.out
      - '**Conclusao e reforco:** voce praticou shell scripting para administracao no dominio automacao. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'treinamento-shell' /tmp/rhcsa-13.out && echo ok
        expectedOutput: ok
        errorMessage: O script nao produziu a saida esperada.
