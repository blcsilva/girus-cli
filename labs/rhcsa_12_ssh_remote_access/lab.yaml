apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-12-ssh-remote-access-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-12-ssh-remote-access
data:
  lab.yaml: |
    name: rhcsa-12-ssh-remote-access
    title: 'RHCSA 12: SSH, chaves e acesso remoto'
    description: Prepare chave publica e valide os artefatos de acesso remoto usados em administracao segura.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Acesso remoto
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: SSH, chaves e acesso remoto'
      description: Prepare chave publica e valide os artefatos de acesso remoto usados em administracao segura. Este lab detalha cenario, comandos, criterios de validacao e aplicacao pratica em RHEL.
      steps:
      - '**Proposta do lab:** Prepare chave publica e valide os artefatos de acesso remoto usados em administracao segura. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo prepare chave publica e valide os artefatos de acesso remoto usados em administracao segura. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Acesso remoto. SSH e a porta de entrada para administracao remota. Chaves, permissoes e configuracao do daemon precisam ser tratados como uma cadeia.'
      - '**Ligacao com o treinamento oficial:** Este bloco cobre a base operacional: localizar informacao, manipular arquivos, controlar identidades, entender processos, rede e software antes de automatizar qualquer rotina.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `test -s /tmp/rhcsa-12/id_ed25519.pub && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `ssh-keygen` cria par de chaves; proteja a chave privada e copie apenas a publica. `chmod` aplica permissoes; leia modo numerico como dono/grupo/outros. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells.'
      - '**Aplicacao em RHEL real:** Use para acesso administrativo sem senha interativa e com menor exposicao operacional.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-12/.ssh
      - if command -v ssh-keygen >/dev/null 2>&1; then ssh-keygen -t ed25519 -N '' -f /tmp/rhcsa-12/id_ed25519; else echo 'ssh-keygen indisponivel' > /tmp/rhcsa-12/id_ed25519.pub; fi
      - chmod 700 /tmp/rhcsa-12/.ssh
      - 'printf ''RHEL real: ssh user@host; ssh-copy-id; sshd_config; systemctl reload sshd

        '' > /tmp/rhcsa-12/ssh-rhel.txt'
      - '**Conclusao e reforco:** voce praticou ssh, chaves e acesso remoto no dominio acesso remoto. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: test -s /tmp/rhcsa-12/id_ed25519.pub && echo ok
        expectedOutput: ok
        errorMessage: A chave publica SSH nao foi criada ou registrada.
