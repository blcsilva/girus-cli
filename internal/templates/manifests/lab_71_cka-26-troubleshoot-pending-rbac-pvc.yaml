apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-26-troubleshoot-pending-rbac-pvc-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-26-troubleshoot-pending-rbac-pvc\ntitle: 'CKA 26: troubleshooting Pending, RBAC e PVC'\ndescription:\
    \ Treine diagnostico combinado de scheduling, acesso e storage pendente.\nduration: 40m\ntimerEnabled: true\nmaxDuration:\
    \ 40m\nimage: linuxtips/girus-kind-single-node:0.1\ntype: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- troubleshooting\n\
    tasks:\n- name: Diagnosticar Pending, RBAC e PVC em conjunto\n  description: Fixar leitura de sintomas em scheduling,\
    \ permissao e storage.\n  steps:\n  - '**Objetivo de fixacao:** este lab pratica troubleshooting combinado de Pending,\
    \ RBAC e PVC para fixar leitura de sintomas\n    em scheduling, permissao e storage.'\n  - '**Como pensar antes de executar:**\
    \ leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor comando\n    que cria ou altera o recurso\
    \ e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos e parametros importantes:**\n\
    \n    - requests.cpu alto pode impedir scheduling e deixar Pod Pending.\n\n    - PVC com StorageClass inexistente tende\
    \ a ficar Pending.\n\n    - auth can-i confirma permissoes da ServiceAccount.\n\n    - describe pod/pvc mostra eventos\
    \ que explicam o bloqueio.'\n  - '**Referencias oficiais para estudo:**\n\n    - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/\n\
    \n    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\n\n    - https://kubernetes.io/docs/concepts/storage/persistent-volumes/\n\
    \n    - https://kubernetes.io/docs/reference/kubectl/'\n  - '**Pratica:** execute os comandos abaixo e observe a saida\
    \ de cada etapa. No CKA, criar o recurso e so metade do trabalho;\n    a outra metade e provar tecnicamente que ele ficou\
    \ no estado esperado.'\n  - kubectl create namespace cka-26\n  - \"kubectl apply -f - <<EOF\\napiVersion: v1\\nkind: Pod\\\
    nmetadata:\\n  name: pending-cpu\\n  namespace: cka-26\\nspec:\\n  containers:\\n\\\n    \\  - name: pause\\n    image:\
    \ registry.k8s.io/pause:3.9\\n    resources:\\n      requests:\\n        cpu: \\\"100\\\"\\n---\\napiVersion:\\\n    \\\
    \ v1\\nkind: PersistentVolumeClaim\\nmetadata:\\n  name: pvc-pendente\\n  namespace: cka-26\\nspec:\\n  storageClassName:\
    \ storage-inexistente\\n\\\n    \\  accessModes:\\n  - ReadWriteOnce\\n  resources:\\n    requests:\\n      storage: 1Gi\\\
    nEOF\\n\"\n  - kubectl create serviceaccount limited -n cka-26\n  - kubectl auth can-i list pods --as=system:serviceaccount:cka-26:limited\
    \ -n cka-26\n  - kubectl describe pod pending-cpu -n cka-26\n  - kubectl describe pvc pvc-pendente -n cka-26\n  - '**Conclusao\
    \ e reforco:** Ao concluir, voce deve correlacionar Pending com eventos de scheduler, PVC e permissoes antes\n    de alterar\
    \ recursos. Repita o lab sem copiar os comandos, depois refaca contra o relogio e anote qual comando provou que\n    a\
    \ solucao funcionou.'\n  tips:\n  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita\
    \ sem consulta e finalize contra o relogio.\n  validation:\n  - command: kubectl get pod pending-cpu -n cka-26 -o jsonpath='{.status.phase}'\
    \ 2>/dev/null | grep -q Pending && echo ok\n    expectedOutput: ok\n    errorMessage: O Pod pending-cpu deveria estar\
    \ Pending.\n  - command: kubectl get pvc pvc-pendente -n cka-26 -o jsonpath='{.status.phase}' 2>/dev/null | grep -q Pending\
    \ && echo ok\n    expectedOutput: ok\n    errorMessage: O PVC pvc-pendente deveria estar Pending.\n"
