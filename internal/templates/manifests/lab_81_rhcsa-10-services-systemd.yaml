apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-10-services-systemd-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-10-services-systemd
data:
  lab.yaml: |
    name: rhcsa-10-services-systemd
    title: 'RHCSA 10: Servicos, systemd e PID 1'
    description: Relacione systemd, unidades e estado de servicos mesmo quando o container nao executa systemd como PID 1.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Servicos
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Servicos, systemd e PID 1'
      description: Relacione systemd, unidades e estado de servicos mesmo quando o container nao executa systemd como PID 1.
      steps:
      - '**Proposta do lab:** Relacione systemd, unidades e estado de servicos mesmo quando o container nao executa systemd como PID 1. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-10
      - ps -p 1 -o pid,comm,args | tee /tmp/rhcsa-10/pid1.txt
      - (systemctl list-units --type=service --no-pager 2>/dev/null || echo 'systemd indisponivel neste container') | tee /tmp/rhcsa-10/systemd.txt
      - 'printf ''RHEL real: systemctl status sshd; systemctl enable --now service; journalctl -u service

        '' > /tmp/rhcsa-10/comandos-rhel.txt'
      - '**Conclusao e reforco:** voce praticou servicos, systemd e pid 1 no dominio servicos. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'RHEL real' /tmp/rhcsa-10/comandos-rhel.txt && echo ok
        expectedOutput: ok
        errorMessage: O resumo de comandos systemd nao foi criado.
