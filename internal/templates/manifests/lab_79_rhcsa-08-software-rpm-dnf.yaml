apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-08-software-rpm-dnf-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-08-software-rpm-dnf
data:
  lab.yaml: |
    name: rhcsa-08-software-rpm-dnf
    title: 'RHCSA 08: RPM, DNF e repositorios'
    description: Entenda o papel de rpm/dnf no RHEL e registre a ferramenta disponivel no ambiente do lab.
    duration: 30m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Software
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: RPM, DNF e repositorios'
      description: Entenda o papel de rpm/dnf no RHEL e registre a ferramenta disponivel no ambiente do lab. Este lab detalha cenario, comandos, criterios de validacao e aplicacao pratica em RHEL.
      steps:
      - '**Proposta do lab:** Entenda o papel de rpm/dnf no RHEL e registre a ferramenta disponivel no ambiente do lab. Este exercicio pertence ao bloco RH124, alinhado a fundamentos de administracao Linux: shell, arquivos, usuarios, rede, software e servicos.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH124 - https://www.redhat.com/en/services/training/rh124-red-hat-system-administration-i'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo entenda o papel de rpm/dnf no rhel e registre a ferramenta disponivel no ambiente do lab. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Software. Em RHEL, software e repositorios passam por RPM e DNF. O objetivo e saber descobrir, instalar, consultar e remover pacotes com seguranca.'
      - '**Ligacao com o treinamento oficial:** Este bloco cobre a base operacional: localizar informacao, manipular arquivos, controlar identidades, entender processos, rede e software antes de automatizar qualquer rotina.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''dnf install'' /tmp/rhcsa-08/comandos-rhel.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `command` aparece neste lab como parte do roteiro pratico; observe entrada, saida e arquivo alterado. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells. `cat` exibe conteudo; com `tee`, tambem grava a evidencia em arquivo.'
      - '**Aplicacao em RHEL real:** Use para preparar servidores padronizados. Repositorios incorretos explicam boa parte dos problemas de instalacao.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-08
      - (command -v dnf || command -v rpm || command -v apt || true) | tee /tmp/rhcsa-08/package-tool.txt
      - 'printf ''RHEL real: dnf search, dnf install, dnf update, rpm -q, dnf repolist

        '' > /tmp/rhcsa-08/comandos-rhel.txt'
      - cat /tmp/rhcsa-08/comandos-rhel.txt
      - '**Conclusao e reforco:** voce praticou rpm, dnf e repositorios no dominio software. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'dnf install' /tmp/rhcsa-08/comandos-rhel.txt && echo ok
        expectedOutput: ok
        errorMessage: O resumo de comandos DNF/RPM nao foi criado.
