apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-23-nfs-autofs-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-23-nfs-autofs
data:
  lab.yaml: |
    name: rhcsa-23-nfs-autofs
    title: 'RHCSA 23: NFS e automount'
    description: Modele montagem NFS e automounter, separando configuracao persistente de montagem manual.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Storage
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: NFS e automount'
      description: Modele montagem NFS e automounter, separando configuracao persistente de montagem manual.
      steps:
      - '**Proposta do lab:** Modele montagem NFS e automounter, separando configuracao persistente de montagem manual. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-23
      - 'printf ''server.example.com:/exports/tools /mnt/tools nfs defaults,_netdev 0 0

        '' > /tmp/rhcsa-23/fstab.nfs'
      - 'printf ''/tools -fstype=nfs4,rw server.example.com:/exports/tools

        '' > /tmp/rhcsa-23/auto.tools'
      - cat /tmp/rhcsa-23/fstab.nfs /tmp/rhcsa-23/auto.tools
      - '**Conclusao e reforco:** voce praticou nfs e automount no dominio storage. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'nfs' /tmp/rhcsa-23/fstab.nfs && grep -q 'fstype=nfs4' /tmp/rhcsa-23/auto.tools && echo ok
        expectedOutput: ok
        errorMessage: Os exemplos de NFS/autofs nao foram criados.
