apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-07-rbac-serviceaccounts-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-07-rbac-serviceaccounts\ntitle: 'CKA 07: RBAC e ServiceAccounts'\ndescription: Crie permissao minima\
    \ com Role, RoleBinding e valide com auth can-i.\nduration: 25m\ntimerEnabled: true\nmaxDuration: 25m\nimage: linuxtips/girus-kind-single-node:0.1\n\
    type: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- cluster\ntasks:\n- name: Validar permissoes RBAC com ServiceAccounts\n\
    \  description: Fixar permissao minima e validacao de acesso.\n  steps:\n  - '**Objetivo de fixacao:** este lab pratica\
    \ RBAC minimo com ServiceAccount para fixar permissao minima e validacao de acesso.'\n  - '**Como pensar antes de executar:**\
    \ leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor comando\n    que cria ou altera o recurso\
    \ e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos e parametros importantes:**\n\
    \n    - serviceaccount representa uma identidade para workloads.\n\n    - role define verbos e recursos permitidos dentro\
    \ de um namespace.\n\n    - rolebinding liga a Role a uma identidade.\n\n    - kubectl auth can-i prova se uma acao e\
    \ permitida.'\n  - '**Referencias oficiais para estudo:**\n\n    - https://kubernetes.io/docs/reference/kubectl/quick-reference/'\n\
    \  - '**Pratica:** execute os comandos abaixo e observe a saida de cada etapa. No CKA, criar o recurso e so metade do\
    \ trabalho;\n    a outra metade e provar tecnicamente que ele ficou no estado esperado.'\n  - kubectl create namespace\
    \ cka-07\n  - kubectl create serviceaccount auditor -n cka-07\n  - kubectl create role pod-reader --verb=get,list,watch\
    \ --resource=pods -n cka-07\n  - kubectl create rolebinding auditor-pod-reader --role=pod-reader --serviceaccount=cka-07:auditor\
    \ -n cka-07\n  - kubectl auth can-i get pods --as=system:serviceaccount:cka-07:auditor -n cka-07\n  - kubectl auth can-i\
    \ delete pods --as=system:serviceaccount:cka-07:auditor -n cka-07\n  - '**Conclusao e reforco:** Ao concluir, voce deve\
    \ conseguir criar acesso de leitura minimo e provar que permissoes destrutivas\n    continuam negadas. Repita o lab sem\
    \ copiar os comandos, depois refaca contra o relogio e anote qual comando provou que\n    a solucao funcionou.'\n  tips:\n\
    \  - type: tip\n    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta e finalize contra\
    \ o relogio.\n  validation:\n  - command: kubectl auth can-i get pods --as=system:serviceaccount:cka-07:auditor -n cka-07\
    \ 2>/dev/null | grep -q yes &&\n      echo ok\n    expectedOutput: ok\n    errorMessage: A ServiceAccount auditor nao\
    \ consegue listar Pods.\n  - command: kubectl auth can-i delete pods --as=system:serviceaccount:cka-07:auditor -n cka-07\
    \ 2>/dev/null | grep -q no &&\n      echo ok\n    expectedOutput: ok\n    errorMessage: A ServiceAccount auditor recebeu\
    \ permissao excessiva.\n"
