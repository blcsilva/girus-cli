apiVersion: v1
kind: ConfigMap
metadata:
  name: rhcsa-19-storage-partitions-filesystems-lab
  labels:
    app: girus-lab-template
    lab: rhcsa-19-storage-partitions-filesystems
data:
  lab.yaml: |
    name: rhcsa-19-storage-partitions-filesystems
    title: 'RHCSA 19: Storage basico e filesystems'
    description: Investigue discos/montagens e documente comandos de particao e filesystem usados no RHEL.
    duration: 35m
    image: linuxtips/girus-devops:0.1
    type: linux
    tags:
    - RHCSA
    - Linux
    - RHEL
    - blcsilva
    - Storage
    timerEnabled: true
    tasks:
    - name: 'Conhecimento aplicado: Storage basico e filesystems'
      description: Investigue discos/montagens e documente comandos de particao e filesystem usados no RHEL. Este lab detalha cenario, comandos, criterios de validacao e aplicacao pratica em RHEL.
      steps:
      - '**Proposta do lab:** Investigue discos/montagens e documente comandos de particao e filesystem usados no RHEL. Este exercicio pertence ao bloco RH134, alinhado a administracao avancada: automacao, logs, SELinux, storage, boot, seguranca de rede e containers.'
      - '**Contexto de aplicacao:** no RHCSA voce precisa resolver tarefas no terminal, produzir evidencias rapidas e reconhecer quando um recurso depende do ambiente RHEL completo. Neste GIRUS, comandos destrutivos de disco, boot ou servico real sao tratados como roteiro controlado quando o container nao oferece o subsistema.'
      - '**Referencia oficial:** RH134 - https://www.redhat.com/en/services/training/rh134-red-hat-system-administration-ii'
      - '**Cenario pratico:** imagine que voce recebeu um chamado ou tarefa de prova envolvendo investigue discos/montagens e documente comandos de particao e filesystem usados no rhel. O objetivo nao e decorar uma linha de comando, e reconhecer o estado inicial, executar a menor mudanca necessaria e provar o resultado.'
      - '**Dominio RHCSA trabalhado:** Storage. Storage exige cuidado porque comandos reais podem destruir dados. No lab, o roteiro e controlado; em RHEL real, confirme dispositivo, filesystem e persistencia.'
      - '**Ligacao com o treinamento oficial:** Este bloco aprofunda operacao real: automacao, troubleshooting, seguranca, storage, boot, rede avancada e containers com foco em resolver problemas no terminal.'
      - '**Criterio de sucesso antes de executar:** ao final, a validacao automatica precisa retornar `ok`. Leia a validacao agora para entender a evidencia esperada: `grep -q ''mkfs.xfs'' /tmp/rhcsa-19/comandos-rhel.txt && echo ok`.'
      - '**Mapa dos comandos e parametros:** `mkdir -p` cria a arvore completa e nao falha se o diretorio ja existir. `lsblk` mostra discos e volumes; confirme o dispositivo antes de qualquer comando destrutivo. `findmnt` mostra pontos de montagem e origem de cada filesystem. `printf` gera conteudo previsivel e evita ambiguidades de `echo` entre shells.'
      - '**Aplicacao em RHEL real:** Use em expansao de discos, filesystems e montagens. Confirme backup e dispositivo antes de executar em producao.'
      - '**Erros comuns para evitar:** executar comando no diretorio errado, nao validar o arquivo gerado, confundir saida exibida com estado persistido, ignorar mensagens de erro e seguir para o proximo passo sem evidencia.'
      - '**Checklist mental:** 1) qual recurso sera alterado? 2) qual comando mostra o estado atual? 3) qual comando aplica a mudanca? 4) qual saida prova que funcionou? 5) como eu desfaria ou repetiria com seguranca?'
      - '**Como ler os comandos:** opcoes curtas como `-p`, `-c`, `-f` ajustam comportamento imediato; opcoes longas como `--help`, `--version`, `--permanent` explicam intencao. Redirecionamentos como `>` gravam a saida, `| tee` grava e exibe, e `2>/dev/null` silencia erros esperados de ferramentas ausentes no container.'
      - '**Pratica orientada:** execute os comandos abaixo na ordem e observe a saida. Quando aparecer `RHEL real`, trate como referencia de prova para executar em uma VM RHEL completa.'
      - mkdir -p /tmp/rhcsa-19
      - (lsblk 2>/dev/null || df -h) | tee /tmp/rhcsa-19/storage.txt
      - (findmnt 2>/dev/null || mount) | tee /tmp/rhcsa-19/mounts.txt
      - 'printf ''RHEL real: lsblk; parted; mkfs.xfs; mount; blkid; /etc/fstab

        '' > /tmp/rhcsa-19/comandos-rhel.txt'
      - '**Conclusao e reforco:** voce praticou storage basico e filesystems no dominio storage. Antes de seguir, diga em voz alta qual arquivo, comando ou saida provou que a tarefa foi concluida; esse habito reduz erro em prova pratica.'
      tips:
      - type: tip
        title: Ritmo RHCSA
        content: Treine primeiro entendendo o comando; depois repita buscando velocidade, clareza e validacao objetiva.
      validation:
      - command: grep -q 'mkfs.xfs' /tmp/rhcsa-19/comandos-rhel.txt && echo ok
        expectedOutput: ok
        errorMessage: O roteiro de storage basico nao foi criado.
