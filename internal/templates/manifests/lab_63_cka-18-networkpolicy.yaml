apiVersion: v1
kind: ConfigMap
metadata:
  name: cka-18-networkpolicy-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: "name: cka-18-networkpolicy\ntitle: 'CKA 18: NetworkPolicy'\ndescription: Crie uma NetworkPolicy default deny\
    \ para treinar isolamento de trafego.\nduration: 25m\ntimerEnabled: true\nmaxDuration: 25m\nimage: linuxtips/girus-kind-single-node:0.1\n\
    type: kubernetes\ntags:\n- CKA\n- Kubernetes\n- blcsilva\n- networking\ntasks:\n- name: Aplicar NetworkPolicy para isolamento\
    \ de trafego\n  description: Fixar isolamento de trafego de entrada por politica.\n  steps:\n  - '**Objetivo de fixacao:**\
    \ este lab pratica NetworkPolicy default deny para fixar isolamento de trafego de entrada por\n    politica.'\n  - '**Como\
    \ pensar antes de executar:** leia o enunciado, identifique o recurso Kubernetes envolvido, execute o menor comando\n\
    \    que cria ou altera o recurso e valide o estado final com `get`, `describe`, `logs`, `exec` ou `jsonpath`.'\n  - '**Comandos\
    \ e parametros importantes:**\n\n    - kind NetworkPolicy define regras de trafego.\n\n    - podSelector vazio seleciona\
    \ todos os Pods do namespace.\n\n    - policyTypes Ingress ativa controle de entrada.\n\n    - A aplicacao real depende\
    \ de CNI com suporte a NetworkPolicy.'\n  - '**Referencias oficiais para estudo:**\n\n    - https://kubernetes.io/docs/concepts/services-networking/network-policies/'\n\
    \  - '**Pratica:** execute os comandos abaixo e observe a saida de cada etapa. No CKA, criar o recurso e so metade do\
    \ trabalho;\n    a outra metade e provar tecnicamente que ele ficou no estado esperado.'\n  - kubectl create namespace\
    \ cka-18\n  - kubectl create deployment web-netpol --image=nginx:1.25-alpine -n cka-18\n  - \"kubectl apply -f - <<EOF\\\
    napiVersion: networking.k8s.io/v1\\nkind: NetworkPolicy\\nmetadata:\\n  name: default-deny-ingress\\n\\\n    \\  namespace:\
    \ cka-18\\nspec:\\n  podSelector: {}\\n  policyTypes:\\n  - Ingress\\nEOF\\n\"\n  - kubectl get networkpolicy -n cka-18\n\
    \  - kubectl describe networkpolicy default-deny-ingress -n cka-18\n  - '**Conclusao e reforco:** Ao concluir, voce deve\
    \ entender que criar a policy e diferente de ter enforcement pelo plugin\n    de rede. Repita o lab sem copiar os comandos,\
    \ depois refaca contra o relogio e anote qual comando provou que a solucao\n    funcionou.'\n  tips:\n  - type: tip\n\
    \    title: Ritmo CKA\n    content: Execute uma vez consultando, repita sem consulta e finalize contra o relogio.\n  validation:\n\
    \  - command: kubectl get networkpolicy default-deny-ingress -n cka-18 -o jsonpath='{.spec.policyTypes[0]}' 2>/dev/null\
    \ | grep\n      -q Ingress && echo ok\n    expectedOutput: ok\n    errorMessage: A NetworkPolicy default-deny-ingress\
    \ nao existe.\n"
